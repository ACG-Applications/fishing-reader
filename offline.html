<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Graded Japanese Readers</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: "Hiragino Sans", "Meiryo", sans-serif;
        max-width: 600px;
        margin: 60px auto;
        padding: 30px;
        background: #fafafa;
        text-align: center;
        color: #1a3e5c;
        line-height: 1.8;
      }
      .icon { font-size: 64px; margin-bottom: 20px; }
      h1 { font-size: 24px; margin-bottom: 10px; }
      p { color: #4a6a7a; font-weight: 400; }
      .btn {
        display: inline-block;
        padding: 12px 30px;
        background: #2c6b9e;
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        margin-top: 20px;
      }
      .btn:hover { background: #1a4a7a; }
    </style>
  </head>
  <body>
    <div class="icon">📚</div>
    <h1>Offline Mode</h1>
    <p>You are currently offline. Please check your internet connection.</p>
    <p style="font-size:14px; color:#6a8a9a;">
      Some content may already be cached and available.
    </p>
    <a href="." class="btn">Try Again</a>
  </body>
</html>
